# Move to .github/workflows/ci.yml when the repo is created (remote tools may not write inside .github/).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-lock.txt ruff pip-audit
      - run: ruff check src tests scripts
      - run: pip-audit -r requirements-lock.txt
      - run: python -m pytest -q tests
      # tests need data/*.parquet; whether that data may be published is an open question (docs/STATUS.md)
