[package]
name = "imap_engine_c"
version = "0.1.0"
edition = "2021"
description = "Engine C: an independent Rust implementation of the platform's measures, used as a third cross-check"
license = "MIT"
publish = false

[lib]
name = "imap_engine_c"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
